# Use the Netlify UI for private/secret environment variables.
# Don't use this file for that!
# This file needs to be committed to GitHub.

[build]
  publish = "public"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# The /documentation section was retired: docs.overture.bio is the only Overture
# documentation surface. These URLs were public for years, so each section is
# sent to its nearest equivalent on the docs site rather than to a single
# landing page. Ego and the DMS bundle have no successor, so they point at the
# Keycloak deployment guide and Prelude respectively.
[[redirects]]
  from = "/documentation/song/*"
  to = "https://docs.overture.bio/develop/Song/overview"
  status = 301
  force = true

[[redirects]]
  from = "/documentation/score/*"
  to = "https://docs.overture.bio/develop/Score/overview"
  status = 301
  force = true

[[redirects]]
  from = "/documentation/maestro/*"
  to = "https://docs.overture.bio/develop/Maestro/overview"
  status = 301
  force = true

[[redirects]]
  from = "/documentation/arranger/*"
  to = "https://docs.overture.bio/develop/Arranger/overview"
  status = 301
  force = true

[[redirects]]
  from = "/documentation/stage/*"
  to = "https://docs.overture.bio/develop/Stage/overview"
  status = 301
  force = true

[[redirects]]
  from = "/documentation/guides/deployment/*"
  to = "https://docs.overture.bio/deploy/deployment"
  status = 301
  force = true

[[redirects]]
  from = "/documentation/guides/administration/*"
  to = "https://docs.overture.bio/use"
  status = 301
  force = true

[[redirects]]
  from = "/documentation/guides/submission/*"
  to = "https://docs.overture.bio/use/cli-submissions"
  status = 301
  force = true

[[redirects]]
  from = "/documentation/guides/download/*"
  to = "https://docs.overture.bio/use/cli-downloads"
  status = 301
  force = true

[[redirects]]
  from = "/documentation/dms/*"
  to = "https://docs.overture.bio/deploy/prelude"
  status = 301
  force = true

[[redirects]]
  from = "/documentation/ego/*"
  to = "https://docs.overture.bio/deploy/deployment/keycloak"
  status = 301
  force = true

# Catch-all: must stay last, since Netlify matches redirects in file order.
[[redirects]]
  from = "/documentation/*"
  to = "https://docs.overture.bio/develop"
  status = 301
  force = true

[context.production.environment]
  GATSBY_ENABLE_DRAFTS="false"

[context.deploy-preview.environment]
  GATSBY_ENABLE_DRAFTS="false"

[context.branch-deploy.environment]
  GATSBY_ENABLE_DRAFTS="true"
